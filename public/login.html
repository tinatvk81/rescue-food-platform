<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود | نجات غذا</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="logo"><span class="mark">🥖</span> نجات غذا</a>
    </div>
  </header>

  <main class="container" style="padding-top: 40px; max-width: 420px;">
    <h1 class="section-title">ورود با شماره موبایل</h1>

    <div class="form-error" id="error-box"></div>
    <div class="form-success" id="success-box"></div>

    <!-- Step 1: enter phone number -->
    <form id="phone-form">
      <div class="field">
        <label for="phone">شماره موبایل</label>
        <input type="tel" id="phone" placeholder="09123456789" required pattern="09[0-9]{9}" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="request-otp-btn">
        دریافت کد تأیید
      </button>
    </form>

    <!-- Step 2: enter code (hidden until requested) -->
    <form id="code-form" style="display: none;">
      <div class="field">
        <label for="code">کد ۵ رقمی ارسال‌شده</label>
        <input type="text" id="code" inputmode="numeric" maxlength="5" required />
      </div>
      <div class="field">
        <label for="name">نام شما (فقط اگر برای اولین‌بار وارد می‌شید)</label>
        <input type="text" id="name" placeholder="مثلاً سارا" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">تأیید و ورود</button>
      <button type="button" class="btn btn-outline btn-block" id="back-btn" style="margin-top: 10px;">
        بازگشت
      </button>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
